<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Inventory AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3"><a class="navbar-brand" href="#">Inventory AI</a></nav>
  <div class="container py-4">
    <div class="row g-3 mb-3">
      <div class="col-md-4"><div class="card card-metric p-3"><h6>Total Products</h6><h3 id="totalProducts">0</h3></div></div>
      <div class="col-md-4"><div class="card card-metric p-3"><h6>Total Stock Value</h6><h3 id="stockValue">$0</h3></div></div>
      <div class="col-md-4"><div class="card card-metric p-3"><h6>Low Stock Items</h6><h3 id="lowStock">0</h3></div></div>
    </div>
    <div class="row g-3">
      <div class="col-md-6"><canvas id="stockTrendChart"></canvas></div>
      <div class="col-md-6"><canvas id="salesPurchaseChart"></canvas></div>
      <div class="col-md-6"><canvas id="categoryChart"></canvas></div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/charts.js"></script>
<script>
(async () => {
  try {
    const data = await API.getDashboard();
    document.getElementById('totalProducts').innerText = data.total_products;
    document.getElementById('stockValue').innerText = `$${Number(data.total_stock_value).toFixed(2)}`;
    document.getElementById('lowStock').innerText = data.low_stock;
    renderDashboardCharts(data);
  } catch (err) {
    alert(err.message);
  }
})();
</script>
</body>
</html>
