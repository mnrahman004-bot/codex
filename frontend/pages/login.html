<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Inventory AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card p-4 shadow-sm">
          <h4 class="mb-3">Inventory Login</h4>
          <input id="username" class="form-control mb-2" placeholder="Username" />
          <input id="password" type="password" class="form-control mb-3" placeholder="Password" />
          <button id="loginBtn" class="btn btn-primary w-100">Login</button>
          <small id="errorMsg" class="text-danger mt-2"></small>
        </div>
      </div>
    </div>
  </div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script>
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    try {
      const data = await API.login({ username, password });
      localStorage.setItem('auth_token', data.token);
      window.location.href = 'dashboard.html';
    } catch (err) {
      document.getElementById('errorMsg').innerText = err.message;
    }
  });
</script>
</body>
</html>
