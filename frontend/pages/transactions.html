<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transactions - Inventory AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">
  <h3>Transactions</h3>
  <button class="btn btn-outline-primary mb-3" onclick="loadTransactions()">Refresh</button>
  <table class="table table-bordered" id="transactionsTable">
    <thead><tr><th>Product</th><th>Type</th><th>Quantity</th><th>Date</th></tr></thead>
    <tbody></tbody>
  </table>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script>
async function loadTransactions() {
  const transactions = await API.getTransactions();
  document.querySelector('#transactionsTable tbody').innerHTML = transactions.map(t => `
    <tr><td>${t.product_name}</td><td>${t.type}</td><td>${t.quantity}</td><td>${t.date}</td></tr>
  `).join('');
}
loadTransactions();
</script>
</body>
</html>
