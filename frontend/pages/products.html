<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products - Inventory AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">
  <h3>Products</h3>
  <div class="row mb-3">
    <div class="col"><input id="searchInput" class="form-control" placeholder="Search product" oninput="loadProducts()" /></div>
    <div class="col"><input id="categoryInput" class="form-control" placeholder="Filter category" oninput="loadProducts()" /></div>
  </div>
  <table class="table table-striped" id="productsTable">
    <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Qty</th><th>Actions</th></tr></thead>
    <tbody></tbody>
  </table>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script>
async function loadProducts() {
  const search = document.getElementById('searchInput').value;
  const category = document.getElementById('categoryInput').value;
  const params = new URLSearchParams();
  if (search) params.append('search', search);
  if (category) params.append('category', category);

  const products = await API.getProducts(params.toString() ? `?${params.toString()}` : '');
  document.querySelector('#productsTable tbody').innerHTML = products.map(p => `
    <tr><td>${p.name}</td><td>${p.category}</td><td>${p.price}</td><td>${p.quantity}</td>
    <td><button class="btn btn-sm btn-danger" onclick="removeProduct(${p.id})">Delete</button></td></tr>
  `).join('');
}

async function removeProduct(id) {
  await API.deleteProduct(id);
  await loadProducts();
}

loadProducts();
</script>
</body>
</html>
